<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Allie the Owl mascot with glasses holding a document with sparkles">
  <title>Allie the Owl</title>
  <desc>A friendly owl character wearing glasses and holding a document with a checkmark, surrounded by golden sparkles</desc>
  <!-- Sparkle 1 (top left) -->
  <g opacity="0.9">
    <path d="M 60 80 L 65 90 L 60 100 L 55 90 Z" fill="#F4C542"/>
    <path d="M 50 90 L 60 95 L 70 90 L 60 85 Z" fill="#F4C542"/>
  </g>
  
  <!-- Sparkle 2 (top right) -->
  <g opacity="0.9">
    <path d="M 340 100 L 345 110 L 340 120 L 335 110 Z" fill="#F4C542"/>
    <path d="M 330 110 L 340 115 L 350 110 L 340 105 Z" fill="#F4C542"/>
  </g>
  
  <!-- Sparkle 3 (bottom) -->
  <g opacity="0.9">
    <path d="M 320 320 L 325 330 L 320 340 L 315 330 Z" fill="#F4C542"/>
    <path d="M 310 330 L 320 335 L 330 330 L 320 325 Z" fill="#F4C542"/>
  </g>
  
  <!-- Document -->
  <g transform="translate(160, 240) rotate(-15)">
    <!-- Paper -->
    <rect x="0" y="0" width="100" height="130" rx="5" fill="#FFFFFF" stroke="#2D4A3E" stroke-width="2"/>
    <!-- Lines on paper -->
    <line x1="10" y1="20" x2="90" y2="20" stroke="#7A9B8A" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="35" x2="90" y2="35" stroke="#7A9B8A" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="50" x2="90" y2="50" stroke="#7A9B8A" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="65" x2="70" y2="65" stroke="#7A9B8A" stroke-width="2" opacity="0.6"/>
    <!-- Checkmark -->
    <path d="M 30 95 L 40 105 L 70 75" stroke="#2D4A3E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Owl body -->
  <ellipse cx="200" cy="210" rx="75" ry="85" fill="#7A9B8A" stroke="#2D4A3E" stroke-width="3"/>
  
  <!-- Wing (left) -->
  <ellipse cx="135" cy="220" rx="25" ry="45" fill="#5A7B6A" opacity="0.8"/>
  
  <!-- Wing (right) -->
  <ellipse cx="265" cy="220" rx="25" ry="45" fill="#5A7B6A" opacity="0.8"/>
  
  <!-- Owl head -->
  <circle cx="200" cy="130" r="65" fill="#7A9B8A" stroke="#2D4A3E" stroke-width="3"/>
  
  <!-- Ear tufts -->
  <path d="M 160 75 L 150 45 L 165 70 Z" fill="#5A7B6A" stroke="#2D4A3E" stroke-width="2"/>
  <path d="M 240 75 L 250 45 L 235 70 Z" fill="#5A7B6A" stroke="#2D4A3E" stroke-width="2"/>
  
  <!-- Eyes (white background) -->
  <circle cx="175" cy="130" r="25" fill="#FFFFFF" stroke="#2D4A3E" stroke-width="2"/>
  <circle cx="225" cy="130" r="25" fill="#FFFFFF" stroke="#2D4A3E" stroke-width="2"/>
  
  <!-- Pupils -->
  <circle cx="178" cy="132" r="12" fill="#2D4A3E"/>
  <circle cx="228" cy="132" r="12" fill="#2D4A3E"/>
  
  <!-- Eye shine -->
  <circle cx="182" cy="128" r="4" fill="#FFFFFF"/>
  <circle cx="232" cy="128" r="4" fill="#FFFFFF"/>
  
  <!-- Glasses frame -->
  <circle cx="175" cy="130" r="27" fill="none" stroke="#2D4A3E" stroke-width="4"/>
  <circle cx="225" cy="130" r="27" fill="none" stroke="#2D4A3E" stroke-width="4"/>
  
  <!-- Bridge of glasses -->
  <line x1="202" y1="125" x2="198" y2="125" stroke="#2D4A3E" stroke-width="4"/>
  
  <!-- Temples of glasses -->
  <path d="M 148 130 Q 135 128 125 130" stroke="#2D4A3E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 252 130 Q 265 128 275 130" stroke="#2D4A3E" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Beak -->
  <path d="M 200 145 L 190 160 L 210 160 Z" fill="#F4C542" stroke="#2D4A3E" stroke-width="2"/>
  
  <!-- Chest feather detail -->
  <ellipse cx="200" cy="210" rx="40" ry="50" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Feet -->
  <g transform="translate(170, 285)">
    <path d="M 0 0 L -5 15 M 0 0 L 0 15 M 0 0 L 5 15" stroke="#F4C542" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(230, 285)">
    <path d="M 0 0 L -5 15 M 0 0 L 0 15 M 0 0 L 5 15" stroke="#F4C542" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
